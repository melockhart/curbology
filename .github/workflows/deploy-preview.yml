# Deploys the preview to https://curbology.preview.op-site.net
#
# The deploy runs here rather than from a Claude Code session on purpose: those
# sessions cannot reach api.cloudflare.com (the environment's egress policy
# answers 403 to CONNECT), and this is the better arrangement anyway — the
# Cloudflare token lives in this repository's Actions secrets and never enters
# a session.
#
# Required secrets, in Settings → Secrets and variables → Actions:
#
#   CLOUDFLARE_API_TOKEN    Workers Scripts:Edit, Workers Routes:Edit, Zone:Read
#                           A Pages-only token passes every check until deploy
#                           and then returns 403 on workers/scripts.
#   CLOUDFLARE_ACCOUNT_ID   The account that holds the op-site.net zone.
#   PREVIEW_PASSWORD        Opens the admin console on the preview. Without it
#                           there is no console at all, which is a safe default
#                           rather than a broken one.
#
# Optional:
#   ADMIN_EMAILS / OWNER_EMAILS   Comma-separated. Console access, once Tristen
#                                 has an address. Absent means nobody gets in.
name: Deploy preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [preview, production]
        default: preview

# One deploy at a time. Two overlapping runs race on the same Worker and the
# loser silently wins.
concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Empty on a push to main, which always deploys preview.
      TARGET: ${{ inputs.target || 'preview' }}
      SITE: ${{ inputs.target == 'production' && 'curbology.op-site.net' || 'curbology.preview.op-site.net' }}
    environment:
      name: ${{ inputs.target || 'preview' }}
      url: https://${{ inputs.target == 'production' && 'curbology.op-site.net' || 'curbology.preview.op-site.net' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Fail here, with a sentence, rather than 400 lines into a wrangler
      # stack trace that says "authentication error".
      - name: Check the secrets exist
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Playwright is a devDependency for the capture and contrast scripts.
      # Nothing in this job drives a browser, and the download is ~100MB.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # The same three checks that gate a commit. A deploy that skips them is
      # how a red build reaches a URL somebody is about to open.
      - run: npx tsc --noEmit
      - run: npm run lint
      # Only the build reads this: it flattens that environment into
      # dist/server/wrangler.json, which every later wrangler step deploys from.
      - run: npm run build
        env:
          CLOUDFLARE_ENV: ${{ inputs.target == 'production' && 'production' || '' }}

      # Wrangler reports every credential problem as the same sentence —
      # "Authentication error [code: 10000]" — whether the token lacks a
      # permission, is scoped to a different account, or the account id is
      # simply the wrong identifier. This asks Cloudflare directly and says
      # which, so a failure costs one run rather than a guessing game.
      #
      # It prints account NAMES and a match/no-match verdict, never the token
      # and never a full identifier.
      - name: Diagnose the Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"; }

          echo "--- Is the token itself valid? ---"
          verify=$(api user/tokens/verify)
          if [ "$(jq -r '.success' <<<"$verify")" != "true" ]; then
            echo "$verify" | jq -r '.errors[]? | "  [\(.code)] \(.message)"'
            echo "::error::CLOUDFLARE_API_TOKEN is not a valid token. Create a new one and replace the secret."
            exit 1
          fi
          echo "  Valid. Status: $(jq -r '.result.status' <<<"$verify")"

          echo "--- Which accounts can this token see? ---"
          accounts=$(api accounts)
          if [ "$(jq -r '.success' <<<"$accounts")" != "true" ]; then
            echo "$accounts" | jq -r '.errors[]? | "  [\(.code)] \(.message)"'
            echo "::error::The token cannot list accounts. Its Account Resources are probably scoped to nothing, or it is missing Account Settings: Read."
            exit 1
          fi
          count=$(jq -r '.result | length' <<<"$accounts")
          jq -r '.result[] | "  - \(.name)"' <<<"$accounts"

          # An empty list is its own diagnosis, and a different one from a
          # mismatch. A token carrying only Zone-scoped permissions can call
          # this endpoint and see nothing, so zero accounts means the token has
          # no account-scoped permission — not that the id is wrong. Warn and
          # let the Workers check below be decisive, rather than failing a
          # token that might be fine and cannot list.
          if [ "$count" = "0" ]; then
            echo "::warning::This token can see no accounts, which means it has no account-scoped permission. The Workers Scripts row was almost certainly added under Zone instead of Account. Skipping the id match — the Workers check below decides."
          else
            echo "--- Does CLOUDFLARE_ACCOUNT_ID match one of them? ---"
            if jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" 'any(.result[]; .id == $id)' <<<"$accounts" >/dev/null; then
              echo "  Yes — $(jq -r --arg id "$CLOUDFLARE_ACCOUNT_ID" '.result[] | select(.id == $id) | .name' <<<"$accounts")"
            else
              echo "::error::CLOUDFLARE_ACCOUNT_ID is not one of the accounts this token can reach. A common cause is pasting the ZONE ID by mistake — both sit in the same API box on the zone's Overview page, Zone ID first. Copy the one labelled Account ID."
              exit 1
            fi
          fi

          echo "--- Can it actually write Workers? ---"
          workers=$(api "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          if [ "$(jq -r '.success' <<<"$workers")" != "true" ]; then
            echo "$workers" | jq -r '.errors[]? | "  [\(.code)] \(.message)"'
            echo "::error::The token cannot reach the Workers API for this account. Add the permission row Account · Workers Scripts · Edit — the first dropdown must read Account, not Zone. If it already does, check the token's Account Resources includes the account that owns op-site.net, and that CLOUDFLARE_ACCOUNT_ID is the Account ID rather than the Zone ID."
            exit 1
          fi
          echo "  Yes. Workers API reachable."

      # dist/server/wrangler.json is the resolved config the Cloudflare plugin
      # writes at build time — it already carries the custom domain and the
      # vars from wrangler.jsonc. Deploying against it rather than against
      # wrangler.jsonc means the thing deployed is the thing built.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c dist/server/wrangler.json

      # After the deploy, because a secret can only be set on a Worker that
      # exists. On the very first run the console is closed until this step
      # lands, which is the right way round.
      - name: Set the preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CMS_SIGNING_SECRET: ${{ secrets.CMS_SIGNING_SECRET }}
          QUOTE_HASH_SALT: ${{ secrets.QUOTE_HASH_SALT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1" -c dist/server/wrangler.json
            else
              echo "$1 not set — skipping."
            fi
          }
          put ADMIN_EMAILS "$ADMIN_EMAILS"
          put OWNER_EMAILS "$OWNER_EMAILS"
          if [ "$TARGET" = "production" ]; then
            # Setting SUPABASE_URL is what turns preview mode off, so these never reach preview.
            put SUPABASE_URL "$SUPABASE_URL"
            put SUPABASE_SECRET_KEY "$SUPABASE_SECRET_KEY"
            put SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"
            put CMS_SIGNING_SECRET "$CMS_SIGNING_SECRET"
            put QUOTE_HASH_SALT "$QUOTE_HASH_SALT"
            put ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          else
            put PREVIEW_PASSWORD "$PREVIEW_PASSWORD"
          fi

      # Proof, not assumption: the URL answers, and it answers noindex.
      - name: Verify
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://$SITE/ || true)
            [ "$code" = "200" ] && break
            echo "attempt $i: HTTP $code — waiting for DNS and the edge to settle"
            sleep 20
          done
          [ "$code" = "200" ] || { echo "::error::Preview did not return 200 (last: $code)"; exit 1; }
          robots=$(curl -sSI https://$SITE/ | tr -d '\r' | grep -i '^x-robots-tag:' || true)
          echo "$robots"
          if [ "$TARGET" = "production" ]; then echo "Production is up."; exit 0; fi
          case "$robots" in
            *noindex*) echo "Preview is up and not indexable." ;;
            *) echo "::error::X-Robots-Tag noindex missing — refusing to call this deploy good."; exit 1 ;;
          esac
