<style>
  /*
   * The real brand faces, served from Curbology's own domain rather than
   * Google's — no third-party dependency in a message that may be read years
   * from now, and the same files the site already ships.
   *
   * Apple Mail, iOS Mail, Outlook for Mac and Thunderbird load these. Everything
   * else falls to the stack behind them, which is why Georgia sits behind
   * Fraunces (both high-contrast serifs) and Helvetica behind Instrument Sans.
   * The layout must look deliberate either way — it is a fallback, not a
   * degradation.
   */
  @font-face {
    font-family: 'Fraunces';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('{{assetBase}}/fonts/fraunces.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Sans';
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url('{{assetBase}}/fonts/instrument-sans.woff2') format('woff2');
  }

  body { margin:0; padding:0; width:100% !important; background:#e9edf2; }
  table { border-collapse:collapse; }
  img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
  a { color:#1a202c; }

  /* Outlook cannot render the webfont, so give it the fallback explicitly
     rather than letting it guess at a variable font it half-recognises. */
  <!--[if mso]>
  .display { font-family: Georgia, 'Times New Roman', serif !important; }
  .body-type { font-family: Arial, Helvetica, sans-serif !important; }
  <![endif]-->

  @media only screen and (max-width:620px) {
    .shell { width:100% !important; }
    .pad { padding-left:22px !important; padding-right:22px !important; }
    .stack { display:block !important; width:100% !important; padding:0 0 12px 0 !important; }
    .h1 { font-size:28px !important; line-height:32px !important; }
  }
</style>
